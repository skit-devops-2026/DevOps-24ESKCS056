version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: tripcraft-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: tripcraft
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tripcraft-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/tripcraft
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: tripcraft-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:5000

volumes:
  mongo_data:
